name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install uv && uv sync --locked --extra dev

      - name: Audit Python dependencies
        run: uv run pip-audit --progress-spinner off

      - name: Verify public-preview boundary
        run: npm run release:verify

      - name: Typecheck
        run: npm run typecheck

      - name: Run JavaScript tests
        run: npm test -- --reporter=dot

      - name: Run maintained frontend smoke
        run: npm run frontend:smoke

      - name: Build web and Harness v2 service
        run: npm run build && npm run harness:v2:build

      - name: Run Python tests
        run: uv run pytest -q
